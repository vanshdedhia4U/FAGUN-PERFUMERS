<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Fagun Perfumers</title>
    <script type="text/javascript">
      // Single Page Application redirect script for GitHub Pages
      // Redirects 404 paths to index.html with route preserved in hash
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var redirectPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#/' +
        redirectPath + (l.search ? l.search : '') + l.hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecting to Fagun Perfumers...</p>
  </body>
</html>
